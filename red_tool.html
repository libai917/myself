<!DOCTYPE html>
<html lang="zh-CN"><head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#0e1226">
<title>RED 主题工具箱</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{
--bg:#0e1226;--card:rgba(29,39,72,.55);--card-solid:#1d2748;--accent:#2f54a3;--primary:#ff5e7a;--primary2:#ffa14d;
--text:#eef1ff;--text2:#9aa3c7;--ok:#4ecca3;--border:rgba(255,255,255,.09);--radius:16px;
--shadow:0 10px 34px rgba(0,0,0,.38);--glow:0 0 24px rgba(255,94,122,.25);--glow-ok:0 0 24px rgba(78,204,163,.22)}
body{background:
radial-gradient(1100px 560px at 85% -12%,rgba(255,94,122,.14),transparent 60%),
radial-gradient(900px 520px at -12% 18%,rgba(47,84,163,.28),transparent 55%),
linear-gradient(165deg,#0e1226,#141c38 45%,#0b0f20);
background-attachment:fixed;background-repeat:no-repeat;
color:var(--text);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'PingFang SC','Microsoft YaHei',sans-serif;font-size:15px;line-height:1.5;min-height:100vh;padding-bottom:60px}
.header{position:sticky;top:0;z-index:100;padding:22px 16px;text-align:center;
background:rgba(14,18,38,.72);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);
border-bottom:1px solid var(--border);box-shadow:0 8px 32px rgba(0,0,0,.25);overflow:hidden}
.header::before{content:'';position:absolute;inset:0;pointer-events:none;
background:linear-gradient(120deg,rgba(255,94,122,.16),rgba(47,84,163,.22) 45%,rgba(255,161,77,.14))}
.header h1{font-size:19px;font-weight:800;color:#fff;letter-spacing:.5px;position:relative;
background:linear-gradient(90deg,#ff8eb0,#ff5e7a 40%,#ffa96b);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
.header .sub{font-size:12px;color:var(--text2);margin-top:5px;position:relative}
.container{max-width:900px;margin:0 auto;padding:14px 14px 8px}
/* ===== 顶部模式切换 ===== */
.mode-tabs{display:flex;gap:0;margin-bottom:14px;border-radius:14px;overflow:hidden;border:1px solid var(--border);background:var(--card);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
.mode-tab{flex:1;padding:13px 10px;border:none;background:transparent;color:var(--text2);font-size:14px;font-weight:600;cursor:pointer;transition:all .25s cubic-bezier(.4,0,.2,1);text-align:center;position:relative}
.mode-tab.active.extract{background:linear-gradient(135deg,var(--primary),var(--primary2));color:#fff;box-shadow:0 4px 16px rgba(255,94,122,.3)}
.mode-tab.active.pack{background:linear-gradient(135deg,var(--ok),var(--primary2));color:#fff;box-shadow:0 4px 16px rgba(78,204,163,.3)}
.mode-tab:active{transform:scale(.97)}
/* ===== Drop Zone ===== */
.drop-zone{display:block;border:2px dashed rgba(255,255,255,.18);border-radius:20px;padding:42px 16px;text-align:center;cursor:pointer;transition:all .25s cubic-bezier(.4,0,.2,1);background:var(--card);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);margin-bottom:14px;width:100%;box-sizing:border-box;position:relative;overflow:hidden}
.drop-zone::after{content:'';position:absolute;inset:0;pointer-events:none;opacity:0;transition:opacity .25s;background:radial-gradient(420px 180px at 50% -20%,rgba(255,94,122,.18),transparent 70%)}
.drop-zone.pack::after{background:radial-gradient(420px 180px at 50% -20%,rgba(78,204,163,.18),transparent 70%)}
.drop-zone:hover{border-color:var(--primary);transform:translateY(-2px);box-shadow:var(--shadow),var(--glow)}
.drop-zone.pack:hover{border-color:var(--ok);box-shadow:var(--shadow),var(--glow-ok)}
.drop-zone:hover::after{opacity:1}
.drop-zone:active{transform:scale(.985)}
.drop-zone .icon{font-size:44px;margin-bottom:10px;opacity:.85;filter:drop-shadow(0 6px 14px rgba(255,94,122,.35));animation:float 3.5s ease-in-out infinite}
.drop-zone.pack .icon{filter:drop-shadow(0 6px 14px rgba(78,204,163,.35))}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
.drop-zone .text{font-size:15px;color:var(--text);font-weight:600}
.drop-zone .hint{font-size:12px;color:var(--text2);margin-top:7px;opacity:.8}
input[type=file]{display:none}
/* ===== File Info ===== */
.file-info{background:var(--card);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border:1px solid var(--border);border-radius:var(--radius);padding:15px;margin-bottom:14px;font-size:13px;display:none;box-shadow:var(--shadow);animation:fadeUp .35s ease}
.file-info.show{display:block}
@keyframes fadeUp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
.file-info .row{display:flex;justify-content:space-between;padding:4.5px 0;border-bottom:1px solid rgba(255,255,255,.06)}
.file-info .row:last-child{border:0}
.file-info .label{color:var(--text2)}
.file-info .val{color:var(--text);font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:12px;text-align:right;word-break:break-all}
/* ===== Section Title ===== */
.section-title{font-size:14px;font-weight:700;margin:18px 0 10px;display:flex;align-items:center;gap:8px;letter-spacing:.3px}
.section-title::before{content:'';width:4px;height:14px;border-radius:2px;background:linear-gradient(180deg,var(--primary),var(--primary2))}
.section-title .badge{background:linear-gradient(135deg,var(--primary),var(--primary2));color:#fff;font-size:11px;padding:2px 10px;border-radius:12px;font-weight:600;box-shadow:0 2px 10px rgba(255,94,122,.3)}
/* ===== Buttons ===== */
.btn{display:inline-block;padding:11px 20px;border-radius:12px;border:none;font-size:14px;font-weight:600;cursor:pointer;transition:all .18s cubic-bezier(.4,0,.2,1);text-decoration:none;letter-spacing:.3px}
.btn-primary{background:linear-gradient(135deg,var(--primary),var(--primary2));color:#fff;box-shadow:0 4px 18px rgba(255,94,122,.35)}
.btn-primary:hover{box-shadow:0 6px 26px rgba(255,94,122,.5);transform:translateY(-1px)}
.btn-primary:active{transform:scale(.95);box-shadow:none}
.btn-ok{background:linear-gradient(135deg,var(--ok),var(--primary2));color:#fff;box-shadow:0 4px 18px rgba(78,204,163,.35);width:100%}
.btn-ok:hover{box-shadow:0 6px 26px rgba(78,204,163,.5);transform:translateY(-1px)}
.btn-ok:active{transform:scale(.97);box-shadow:none}
.btn-secondary{background:linear-gradient(135deg,rgba(47,84,163,.85),rgba(60,45,140,.85));color:var(--text)}
.btn-secondary:hover{box-shadow:0 4px 18px rgba(47,84,163,.4);transform:translateY(-1px)}
.btn-secondary:active{transform:scale(.95);box-shadow:none}
.btn:disabled{opacity:.4;cursor:not-allowed;transform:none;box-shadow:none}
.toolbar{display:flex;gap:10px;margin-bottom:14px;flex-wrap:wrap}
.toolbar .btn{flex:1;min-width:120px;text-align:center}
/* ===== Stats ===== */
.stats{display:flex;gap:10px;margin-bottom:14px;flex-wrap:wrap}
.stats .stat{flex:1;min-width:80px;background:var(--card);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border:1px solid var(--border);border-radius:14px;padding:13px 10px;text-align:center;transition:transform .2s}
.stats .stat:hover{transform:translateY(-2px)}
.stats .stat .num{font-size:21px;font-weight:800;background:linear-gradient(90deg,var(--primary),var(--primary2));-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
.stats .stat .label{font-size:11px;color:var(--text2);margin-top:3px;letter-spacing:.5px}
/* ===== Type Filter ===== */
.type-filter{display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap}
.type-filter .chip{padding:6px 14px;border-radius:18px;font-size:12px;background:var(--card);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);color:var(--text2);cursor:pointer;transition:all .18s;border:1px solid var(--border)}
.type-filter .chip.active{background:linear-gradient(135deg,var(--primary),var(--primary2));color:#fff;border-color:transparent;box-shadow:0 3px 12px rgba(255,94,122,.35);font-weight:600}
.type-filter .chip:active{transform:scale(.94)}
.type-filter .chip:hover:not(.active){border-color:rgba(255,94,122,.4);color:var(--text)}
/* ===== File Grid ===== */
.file-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(118px,1fr));gap:12px}
.file-card{background:var(--card);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border:1px solid var(--border);border-radius:14px;overflow:hidden;position:relative;cursor:pointer;transition:all .2s cubic-bezier(.4,0,.2,1);animation:cardIn .4s cubic-bezier(.34,1.4,.5,1) backwards}
.file-card:nth-child(n){animation-delay:calc(var(--i,0)*30ms)}
@keyframes cardIn{from{opacity:0;transform:translateY(14px) scale(.95)}to{opacity:1;transform:translateY(0) scale(1)}}
.file-card:hover{transform:translateY(-4px);border-color:rgba(255,94,122,.45);box-shadow:0 12px 32px rgba(0,0,0,.4),var(--glow)}
.file-card:active{transform:scale(.97)}
.file-card .preview{width:100%;height:104px;background:linear-gradient(160deg,#101b38,#0d152b);display:flex;align-items:center;justify-content:center;overflow:hidden;position:relative}
.file-card .preview img{width:100%;height:100%;object-fit:cover;transition:transform .35s}
.file-card:hover .preview img{transform:scale(1.06)}
.file-card .preview .placeholder{font-size:30px;opacity:.55;filter:drop-shadow(0 4px 10px rgba(0,0,0,.4))}
.file-card .preview::after{content:'';position:absolute;inset:0;background:linear-gradient(180deg,transparent 62%,rgba(10,14,30,.55))}
.file-card .preview .ext-badge{position:absolute;top:6px;right:6px;background:rgba(10,14,30,.72);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);color:#fff;font-size:10px;padding:3px 8px;border-radius:8px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;z-index:1}
.file-card .info{padding:9px 10px 4px}
.file-card .name{font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--text)}
.file-card .size{font-size:10px;color:var(--text2);margin-top:3px}
.file-card .actions{display:flex;gap:6px;padding:8px 10px 10px}
.file-card .actions a{flex:1;text-align:center;font-size:11px;padding:6px;border-radius:8px;text-decoration:none;font-weight:600;transition:all .15s}
.file-card .actions .dl-btn{background:linear-gradient(135deg,rgba(47,84,163,.9),rgba(60,45,140,.9));color:var(--text)}
.file-card .actions .dl-btn:hover{box-shadow:0 3px 12px rgba(47,84,163,.45)}
.file-card .actions .view-btn{background:rgba(255,255,255,.07);color:var(--text);border:1px solid rgba(255,255,255,.08)}
.file-card .actions .view-btn:hover{background:rgba(255,255,255,.13)}
/* ===== Tree Box ===== */
.tree-box{background:var(--card);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border:1px solid var(--border);border-radius:14px;padding:16px 14px;margin-bottom:14px;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:12px;max-height:340px;overflow:auto;line-height:1.75;white-space:pre;color:var(--text)}
.tree-box .folder{color:#7fb2ff}
.tree-box .file{color:var(--text)}
.tree-box .meta{color:var(--text2)}
/* ===== Name Row ===== */
.name-row{display:flex;gap:10px;align-items:center;margin-bottom:14px;background:var(--card);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border:1px solid var(--border);border-radius:14px;padding:12px 14px}
.name-row label{font-size:13px;color:var(--text2);white-space:nowrap}
.name-row input{flex:1;background:rgba(10,14,30,.6);border:1px solid var(--border);border-radius:10px;color:var(--text);font-size:13px;padding:9px 12px;outline:none;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;transition:border-color .2s}
.name-row input:focus{border-color:var(--ok)}
/* ===== Encoding Hint ===== */
.encoding-hint{font-size:12px;color:var(--text2);margin:8px 0 14px;padding:10px 14px;background:rgba(47,84,163,.15);border:1px solid rgba(47,84,163,.35);border-radius:10px;line-height:1.7}
.encoding-hint code{color:#8fd8ff;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
/* ===== Progress ===== */
.progress{height:6px;background:rgba(255,255,255,.07);border-radius:3px;overflow:hidden;margin:10px 0;display:none;position:relative}
.progress.show{display:block}
.progress-bar{height:100%;background:linear-gradient(90deg,var(--accent),var(--primary),var(--primary2));background-size:200% 100%;transition:width .35s cubic-bezier(.4,0,.2,1);width:0;animation:shimmer 1.6s linear infinite}
@keyframes shimmer{0%{background-position:0% 0}100%{background-position:200% 0}}
/* ===== Loading ===== */
.loading-overlay{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(8,10,22,.78);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);display:none;align-items:center;justify-content:center;z-index:999;flex-direction:column;gap:14px}
.loading-overlay.show{display:flex;animation:fadeIn .2s ease}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.loading-overlay .spinner{width:46px;height:46px;border-radius:50%;border:3px solid rgba(255,255,255,.12);border-top-color:var(--primary);border-right-color:var(--primary2);animation:spin .9s linear infinite;box-shadow:0 0 24px rgba(255,94,122,.2)}
.loading-overlay .text{color:var(--text);font-size:14px;letter-spacing:.5px}
@keyframes spin{to{transform:rotate(360deg)}}
/* ===== Toast ===== */
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(20px);background:linear-gradient(135deg,rgba(30,48,90,.95),rgba(20,28,60,.95));backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border:1px solid rgba(78,204,163,.4);color:#d9fff2;padding:12px 22px;border-radius:14px;font-size:13px;z-index:998;opacity:0;transition:all .3s cubic-bezier(.34,1.4,.5,1);pointer-events:none;white-space:nowrap;box-shadow:0 8px 30px rgba(0,0,0,.45);max-width:90vw}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
/* ===== Preview Modal ===== */
.preview-modal{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(8,10,22,.85);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);display:none;align-items:center;justify-content:center;z-index:997;padding:20px;flex-direction:column;animation:fadeIn .2s ease}
.preview-modal.show{display:flex}
.preview-modal .close-btn{position:absolute;top:14px;right:14px;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.12);color:#fff;width:38px;height:38px;border-radius:50%;font-size:16px;cursor:pointer;z-index:1;transition:all .18s;display:flex;align-items:center;justify-content:center}
.preview-modal .close-btn:hover{background:var(--primary);transform:rotate(90deg)}
.preview-modal .content{max-width:100%;max-height:82vh;overflow:auto;border-radius:14px;box-shadow:0 20px 60px rgba(0,0,0,.5);animation:zoomIn .3s cubic-bezier(.34,1.4,.5,1)}
@keyframes zoomIn{from{opacity:0;transform:scale(.9)}to{opacity:1;transform:scale(1)}}
.preview-modal .content img{max-width:100%;max-height:82vh;display:block;border-radius:14px}
.preview-modal .content svg{max-width:100%;max-height:82vh;display:block;background:#fff;border-radius:14px}
.preview-modal .content video,.preview-modal .content audio{width:100%;max-width:500px;border-radius:12px}
.preview-modal .content .text-preview{background:rgba(20,28,58,.9);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border:1px solid var(--border);padding:18px;border-radius:14px;color:var(--text);font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:12px;white-space:pre-wrap;word-break:break-all;max-height:82vh;overflow:auto;max-width:92vw;line-height:1.7}
.preview-modal .fname{color:#fff;font-size:13px;margin-top:12px;text-align:center;max-width:90vw;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
/* ===== Empty State ===== */
.empty-state{text-align:center;padding:52px 16px;color:var(--text2)}
.empty-state .icon{font-size:54px;opacity:.35;margin-bottom:10px;display:inline-block;animation:float 4s ease-in-out infinite}
/* ===== Scrollbar ===== */
::-webkit-scrollbar{width:8px;height:8px}
::-webkit-scrollbar-thumb{background:rgba(255,255,255,.15);border-radius:4px}
::-webkit-scrollbar-thumb:hover{background:rgba(255,94,122,.4)}
::-webkit-scrollbar-track{background:transparent}
@media(max-width:480px){.file-grid{grid-template-columns:repeat(auto-fill,minmax(92px,1fr))}.file-card .preview{height:84px}.stats .stat .num{font-size:17px}.name-row{flex-direction:column;align-items:stretch}.name-row label{white-space:normal}.mode-tab{font-size:12px;padding:11px 6px}}
</style>
</head>
<body>

<div class="header">
<h1>RED 主题工具箱</h1>
<div class="sub">reeden .red 提取 &amp; 打包 · 本地处理 · 手机端</div>
</div>

<div class="container">

<!-- ===== 顶部模式切换 ===== -->
<div class="mode-tabs">
<button class="mode-tab active extract" data-mode="extract">📂 提取 .red</button>
<button class="mode-tab" data-mode="pack">📦 打包 .red</button>
</div>

<!-- ===== 提取模式 ===== -->
<div id="extractPanel">
<label class="drop-zone" id="dropZoneExtract">
<div class="icon">📁</div>
<div class="text">点击选择 .red 主题文件</div>
<div class="hint">支持 reeden 加密/未加密格式 · 所有处理在本地完成</div>
<input type="file" id="extractInput" accept=".red,application/octet-stream">
</label>

<div class="progress" id="progress"><div class="progress-bar" id="progressBar"></div></div>
<div class="file-info" id="extractFileInfo"></div>

<div id="extractedSection" style="display:none">
<div class="stats" id="extractStats"></div>
<div class="toolbar">
<button class="btn btn-primary" id="downloadAllBtn">📦 全部下载 (ZIP)</button>
<button class="btn btn-secondary" id="downloadImagesBtn">🖼️ 仅图片 (ZIP)</button>
</div>
<div class="type-filter" id="typeFilter"></div>
<div class="section-title">提取的文件 <span class="badge" id="extractFileCount">0</span></div>
<div class="file-grid" id="fileGrid"></div>
</div>

<div class="empty-state" id="extractEmpty">
<div class="icon">📂</div>
<div>选择 .red 文件后,此处显示提取结果</div>
</div>
</div>

<!-- ===== 打包模式 ===== -->
<div id="packPanel" style="display:none">
<label class="drop-zone pack" id="dropZoneFolder">
<div class="icon">📁</div>
<div class="text">点击选择主题文件夹</div>
<div class="hint">选择 ZIP 解压后的文件夹 · 自动剥离外层目录</div>
<input type="file" id="packFolderInput" webkitdirectory="" directory="" multiple="">
</label>

<div class="file-info" id="packFileInfo"></div>

<div id="packSection" style="display:none">
<div class="stats" id="packStats"></div>
<div class="section-title">文件目录结构 <span class="badge" id="packFileCount">0</span></div>
<div class="tree-box" id="treeBox"></div>
<div class="encoding-hint">打包格式：<code>RED</code> (3B magic) + <code>0x04</code> (版本/未加密标志) + <strong>ZIP 字节</strong>（单一顶层目录自动剥离）</div>
<div class="name-row">
<label for="redName">保存文件名</label>
<input type="text" id="redName" value="theme.red" spellcheck="false">
</div>
<div class="toolbar">
<button class="btn btn-ok" id="packBtn">📦 打包为 .red 文件</button>
</div>
</div>
</div>

</div>

<!-- ===== Loading & Toast & Preview ===== -->
<div class="loading-overlay" id="loadingOverlay">
<div style="text-align:center">
<div class="spinner"></div>
<div class="text" id="loadingText">正在处理...</div>
</div>
</div>
<div class="toast" id="toast"></div>
<div class="preview-modal" id="previewModal">
<button class="close-btn" onclick="closePreview()">✕</button>
<div class="content" id="previewContent"></div>
<div class="fname" id="previewName"></div>
</div>

<script>
// ================================================================
//  RED 主题工具箱 — 提取 & 打包 合一
// ================================================================

// ========== 共享工具函数 ==========
function showToast(msg){
const t=document.getElementById('toast');
t.textContent=msg;t.classList.add('show');
setTimeout(()=>t.classList.remove('show'),2500);
}
function showLoading(text){
document.getElementById('loadingText').textContent=text||'处理中...';
document.getElementById('loadingOverlay').classList.add('show');
}
function hideLoading(){document.getElementById('loadingOverlay').classList.remove('show')}
function setProgress(pct){
const bar=document.getElementById('progressBar');
const wrap=document.getElementById('progress');
if(pct>=0){wrap.classList.add('show');bar.style.width=pct+'%'}
else{wrap.classList.remove('show')}
}
function bytesToSize(bytes){
if(bytes<1024)return bytes+' B';
if(bytes<1048576)return(bytes/1024).toFixed(1)+' KB';
return(bytes/1048576).toFixed(1)+' MB';
}
function escapeHtml(str){return String(str).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}

// ================================================================
//  模式切换
// ================================================================
let currentMode='extract';
document.querySelectorAll('.mode-tab').forEach(tab=>{
tab.addEventListener('click',function(){
const mode=this.dataset.mode;
if(mode===currentMode)return;
currentMode=mode;
document.querySelectorAll('.mode-tab').forEach(t=>t.classList.remove('active'));
this.classList.add('active');
document.getElementById('extractPanel').style.display=mode==='extract'?'block':'none';

// ================================================================
//  提取模式: 全部逻辑
// ================================================================
const SIGNATURES=[
{sig:[0x47,0x49,0x46,0x38,0x37,0x61],ext:'gif',type:'image',mime:'image/gif'},
{sig:[0x47,0x49,0x46,0x38,0x39,0x61],ext:'gif',type:'image',mime:'image/gif'},
{sig:[0x89,0x50,0x4E,0x47,0x0D,0x0A,0x1A,0x0A],ext:'png',type:'image',mime:'image/png'},
{sig:[0xFF,0xD8,0xFF],ext:'jpg',type:'image',mime:'image/jpeg'},
{sig:[0x52,0x49,0x46,0x46],ext:'webp',type:'image',mime:'image/webp'},
{sig:[0x3C,0x3F,0x78,0x6D,0x6C],ext:'xml',type:'vector',mime:'image/svg+xml'},
{sig:[0x3C,0x73,0x76,0x67],ext:'svg',type:'vector',mime:'image/svg+xml'},
{sig:[0x50,0x4B,0x03,0x04],ext:'zip',type:'archive',mime:'application/zip'},
{sig:[0x49,0x44,0x33],ext:'mp3',type:'audio',mime:'audio/mpeg'},
{sig:[0x1A,0x45,0xDF,0xA3],ext:'webm',type:'video',mime:'video/webm'},
];
const EXT_MIME={jpg:'image/jpeg',jpeg:'image/jpeg',png:'image/png',gif:'image/gif',webp:'image/webp',svg:'image/svg+xml',mp3:'audio/mpeg',ogg:'audio/ogg',flac:'audio/flac',webm:'video/webm',mp4:'video/mp4',json:'application/json',txt:'text/plain',xml:'application/xml',zip:'application/zip',img:'application/octet-stream'};
const EXT_TYPE={jpg:'image',jpeg:'image',png:'image',gif:'image',webp:'image',svg:'vector',mp3:'audio',ogg:'audio',flac:'audio',webm:'video',mp4:'video',json:'json',txt:'text',xml:'vector',zip:'archive',img:'binary'};
const TYPE_LABELS={image:'图片',vector:'矢量图',audio:'音频',video:'视频',archive:'压缩包',json:'JSON',text:'文本',binary:'二进制',other:'其他'};

let extractedFiles=[];
let activeFilter='all';

function getFileExt(filename){
const parts=filename.split('.');
if(parts.length<2)return '';
return parts[parts.length-1].toLowerCase();
}
function detectTypeBySignature(data){
if(data.length<4)return null;
if(data[0]===0x89&&data[1]===0x50&&data[2]===0x4E&&data[3]===0x47)return{ext:'png',mime:'image/png',type:'image'};
if(data[0]===0xFF&&data[1]===0xD8&&data[2]===0xFF)return{ext:'jpg',mime:'image/jpeg',type:'image'};
if(data[0]===0x47&&data[1]===0x49&&data[2]===0x46)return{ext:'gif',mime:'image/gif',type:'image'};
if(data[0]===0x52&&data[1]===0x49&&data[2]===0x46&&data[3]===0x46)return{ext:'webp',mime:'image/webp',type:'image'};
if(data[0]===0x3C&&data[1]===0x3F)return{ext:'svg',mime:'image/svg+xml',type:'vector'};
if(data[0]===0x3C&&data[1]===0x73&&data[2]===0x76&&data[3]===0x67)return{ext:'svg',mime:'image/svg+xml',type:'vector'};
if(data[0]===0x49&&data[1]===0x44&&data[2]===0x33)return{ext:'mp3',mime:'audio/mpeg',type:'audio'};
if(data[0]===0x1A&&data[1]===0x45&&data[2]===0xDF&&data[3]===0xA3)return{ext:'webm',mime:'video/webm',type:'video'};
return null;
}
function matchSignature(data,offset){
for(const s of SIGNATURES){
if(offset+s.sig.length>data.length)continue;
let match=true;
for(let i=0;i<s.sig.length;i++){if(data[offset+i]!==s.sig[i]){match=false;break}}
if(match)return s;
}
return null;
}

function parseRedFile(arrayBuffer){
const data=new Uint8Array(arrayBuffer);
if(data.length<8||data[0]!==0x52||data[1]!==0x45||data[2]!==0x44)throw new Error('不是有效的 .red 文件 (magic 不匹配)');
const versionFlags=data[3];
// ZIP 模式
if(data[4]===0x50&&data[5]===0x4B&&data[6]===0x03&&data[7]===0x04){
return{zipMode:true,versionFlags,zipData:data.slice(4),totalSize:data.length};
}
// 加密模式
const jsonLength=(data[4]<<24)|(data[5]<<16)|(data[6]<<8)|data[7];
const jsonStart=8;
const jsonEnd=jsonStart+jsonLength;
const jsonStr=new TextDecoder('utf-8').decode(data.slice(jsonStart,jsonEnd));
const header=JSON.parse(jsonStr);
const manifestStart=jsonEnd;
const manifestLength=header.manifestLength||0;
const manifestEnd=manifestStart+manifestLength;
const assetData=data.slice(manifestEnd);
return{zipMode:false,header,versionFlags,jsonLength,manifestStart,manifestLength,manifestEnd,assetData,totalSize:data.length};
}

async function extractZipAssets(zipData){
const zip=await JSZip.loadAsync(zipData);
const files=[];
const entries=Object.values(zip.files).filter(f=>!f.dir);
let idx=0;
for(const entry of entries){
const data=await entry.async('uint8array');
const ext=getFileExt(entry.name);
let mime=EXT_MIME[ext]||'application/octet-stream';
let type=EXT_TYPE[ext]||'other';
let displayExt=ext;
if(type==='other'||type==='binary'||ext==='img'){
const detected=detectTypeBySignature(data);
if(detected){mime=detected.mime;type=detected.type;displayExt=detected.ext;}
}
files.push({index:idx,filename:entry.name,ext:displayExt,name:entry.name.split('/').pop(),type,mime,size:data.length,data,blob:new Blob([data],{type:mime}),url:URL.createObjectURL(new Blob([data],{type:mime}))});
idx++;
}
return files;
}

function scanAssets(assetData){
const entries=[];
let offset=0;
while(offset<assetData.length){
const sig=matchSignature(assetData,offset);
if(sig){entries.push({offset,ext:sig.ext,type:sig.type,mime:sig.mime});offset+=sig.sig.length;}
else{offset++;}
}
const merged=[];
let i=0;
while(i<entries.length){
const e=entries[i];
if(e.ext==='xml'&&i+1<entries.length&&entries[i+1].ext==='svg'){
const end=entries[i+2]?entries[i+2].offset:assetData.length;
merged.push({offset:e.offset,ext:'svg',type:'vector',mime:'image/svg+xml',end});
i+=2;
}else{
const end=entries[i+1]?entries[i+1].offset:assetData.length;
merged.push({offset:e.offset,ext:e.ext,type:e.type,mime:e.mime,end});
i++;
}
}
return merged.map((m,idx)=>{
const fileData=assetData.slice(m.offset,m.end);
return{index:idx,ext:m.ext,name:'',type:m.type,mime:m.mime,size:fileData.length,data:fileData,blob:new Blob([fileData],{type:m.mime}),url:URL.createObjectURL(new Blob([fileData],{type:m.mime}))};
});
}

files.forEach(f=>{types[f.type]=(types[f.type]||0)+1;totalSize+=f.size});

//  打包模式: 全部逻辑
// ================================================================
let zipEntries=[];
let topDir='';
let folderFiles=[];
let folderName='';

function renderTree(entries){
const files=entries.filter(e=>!e.dir);
const tree={};
for(const f of files){
const parts=f.name.split('/');
let node=tree;
for(let i=0;i<parts.length-1;i++){const p=parts[i];node[p]=node[p]||{};node=node[p];}
node[parts[parts.length-1]]={size:f.size};
}
const getSizeBytes=s=>s<1024?s+'B':(s/1024).toFixed(0)+'KB';
const lines=[];
function walk(node,prefix,isRoot){
const items=Object.keys(node);
const total=items.length;
items.forEach((name,idx)=>{
const last=idx===total-1;
const conn=isRoot?'├── ':(last?'└── ':'├── ');
const child=node[name];
if(child.size!=null){
const meta=' <span class="meta">('+getSizeBytes(child.size)+')</span>';
lines.push(prefix+conn+'<span class="file">'+escapeHtml(name)+'</span>'+meta);
}else{
lines.push(prefix+conn+'<span class="folder">'+escapeHtml(name)+'/</span>');
walk(child,prefix+(last?'    ':'│   '),false);
}
});
}
walk(tree,'',true);
document.getElementById('treeBox').innerHTML=lines.join('\n');
}

function displayPackStats(entries){
const el=document.getElementById('packStats');
const files=entries.filter(e=>!e.dir);
const totalSize=files.reduce((s,f)=>s+f.size,0);
const zipSizeStr='≈ '+bytesToSize(totalSize+4);
el.innerHTML=`
<div class="stat"><div class="num">${files.length}</div><div class="label">文件总数</div></div>
<div class="stat"><div class="num">${bytesToSize(totalSize)}</div><div class="label">资源总大小</div></div>

}

function displayPackFileInfo(){
const el=document.getElementById('packFileInfo');
const totalSize=folderFiles.reduce((s,f)=>s+f.size,0);
el.innerHTML=`
<div class="row"><span class="label">来源文件夹</span><span class="val">${folderName}</span></div>
<div class="row"><span class="label">文件数</span><span class="val">${folderFiles.length}</span></div>
<div class="row"><span class="label">总大小</span><span class="val">${bytesToSize(totalSize)}</span></div>`;

function detectTopDir(entries){
const files=entries.filter(e=>!e.dir);
if(files.length===0)return '';
const topDirs=new Set();
for(const f of files){
const idx=f.name.indexOf('/');
if(idx<0)return '';
topDirs.add(f.name.substring(0,idx));
}
return topDirs.size===1?[...topDirs][0]:'';
}

async function buildZipFromFolder(){
showLoading('正在读取文件并打包 ZIP...');
const cleanZip=new JSZip();
const prefix=topDir?topDir+'/':'';
let processed=0;
const total=folderFiles.length;
for(const file of folderFiles){
let relPath=file.webkitRelativePath||file.name;
let cleanName=prefix&&relPath.startsWith(prefix)?relPath.substring(prefix.length):relPath;
if(!cleanName)continue;
const data=await file.arrayBuffer();
cleanZip.file(cleanName,data,{compression:'DEFLATE'});
processed++;
if(processed%10===0)showLoading(`正在打包 ${processed}/${total}...`);
if(processed%20===0)await new Promise(r=>setTimeout(r,0));
}
showLoading('正在压缩生成 ZIP...');
return await cleanZip.generateAsync({type:'arraybuffer',compression:'DEFLATE',compressionOptions:{level:6}});
}

async function buildRed(redName){
showLoading('正在生成 .red 文件...');
const zipBytes=await buildZipFromFolder();
const header=new Uint8Array([0x52,0x45,0x44,0x04]);
const blob=new Blob([header,zipBytes],{type:'application/octet-stream'});
const name=redName.trim()||'theme.red';
const finalName=name.toLowerCase().endsWith('.red')?name:name+'.red';
const url=URL.createObjectURL(blob);
const a=document.createElement('a');
a.href=url;a.download=finalName;
document.body.appendChild(a);a.click();document.body.removeChild(a);
setTimeout(()=>URL.revokeObjectURL(url),1000);
hideLoading();
const stripMsg=topDir?` (已剥离 ${topDir}/)`:'';
showToast(`已生成 ${finalName} (${bytesToSize(blob.size)})${stripMsg}`);
}

async function handlePackFolder(fileList){
if(!fileList||fileList.length===0)return;
showLoading('正在读取文件夹...');
try{
folderFiles=Array.from(fileList).filter(f=>{const p=f.webkitRelativePath||f.name;return p&&!p.endsWith('/');});
if(folderFiles.length===0){hideLoading();showToast('错误: 文件夹中没有文件');return;}
zipEntries=folderFiles.map(f=>({name:f.webkitRelativePath||f.name,size:f.size,dir:false}));
const firstPath=folderFiles[0].webkitRelativePath||'';
const slashIdx=firstPath.indexOf('/');
folderName=slashIdx>0?firstPath.substring(0,slashIdx):firstPath;
topDir=detectTopDir(zipEntries);
displayPackFileInfo();
displayPackStats(zipEntries);
renderTree(zipEntries);
document.getElementById('packFileCount').textContent=folderFiles.length;
document.getElementById('packSection').style.display='block';
await trySetDefaultRedName();
hideLoading();
const stripNote=topDir?` (检测到顶层目录 ${topDir}/, 打包时将自动剥离)`:'';
showToast(`文件夹读取成功, 共 ${folderFiles.length} 个文件${stripNote}`);
}catch(err){hideLoading();console.error(err);showToast('错误: '+err.message);}
}

}

// 从 theme.json 提取 name 字段,作为默认 .red 文件名

try{

const themeFile=folderFiles.find(f=>{
const p=f.webkitRelativePath||f.name;
return p.endsWith('theme.json')&&(!prefix||p.startsWith(prefix));
})||folderFiles.find(f=>(f.webkitRelativePath||f.name).endsWith('theme.json'));
if(themeFile){

async function readDirEntry(dirEntry,prefix){
const files=[];
const reader=dirEntry.createReader();
const readAll=()=>new Promise((resolve,reject)=>{
reader.readEntries(async(entries)=>{
if(!entries.length){resolve();return}
for(const entry of entries){
if(entry.isFile){
try{
const file=await new Promise((res,rej)=>entry.file(res,rej));
Object.defineProperty(file,'webkitRelativePath',{value:prefix+entry.name,writable:false});
files.push(file);
}catch(e){}
}else if(entry.isDirectory){
const sub=await readDirEntry(entry,prefix+entry.name+'/');
files.push(...sub);
}
}
readAll().then(resolve).catch(reject);
},reject);
});
await readAll();
return files;
}
document.getElementById('packBtn').addEventListener('click',async function(){
if(!folderFiles.length){showToast('请先选择文件夹');return}
const name=document.getElementById('redName').value||'theme.red';
await buildRed(name);
});
